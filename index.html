<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>wiraniaga</title>
  <!-- Tailwind CSS untuk styling modern -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel untuk kompilasi in-browser di Apps Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  
  <style>
    /* Mengatasi scrollbar default */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .animate-spin-custom {
      animation: spin 1s linear infinite;
    }
  </style>
</head>
<body class="bg-slate-50 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- Format IDR Helper ---
    const formatCurrency = (value) => {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0
      }).format(value || 0);
    };

    const generateId = () => Math.random().toString(36).substr(2, 9);

    // --- Inline SVGs ---
    const IconDashboard = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
    );
    const IconCart = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    );
    const IconTarget = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    );
    const IconIntel = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
    );
    const IconDatabase = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
    );
    const IconPlus = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    );
    const IconEdit = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 1 1 3 3L12 15l-4 1 1-4z"/></svg>
    );
    const IconTrash = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    );
    const IconX = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    );
    const IconLogout = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
    );
    const IconTrendingUp = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18" /><polyline points="17 6 23 6 23 12" /></svg>
    );
    const IconTrendingDown = ({ className = "w-5 h-5" }) => (
      <svg className={className} fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><polyline points="23 18 13.5 8.5 8.5 13.5 1 6" /><polyline points="17 18 23 18 23 12" /></svg>
    );
    const IconMenu = () => (
      <svg className="w-6 h-6" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
    );
    const IconCalendar = () => (
      <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    );
    const IconSparkles = () => (
      <svg className="w-4 h-4 animate-pulse" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m0-12.728l.707.707m11.314 11.314l.707-.707M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"/></svg>
    );

    // --- SUB-COMPONENT: MULTI-PURPOSE SALES FORM ---
    function SalesForm({ currentItem, setCurrentItem, masterArea, masterProduk, updateSalesItem, addSalesItem, removeSalesItem, handleSave }) {
      return (
        <form onSubmit={handleSave} className="p-4 md:p-6 space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase">Tanggal</label>
              <input required type="date" className="w-full p-2.5 bg-slate-50 border rounded-xl mt-1 text-xs font-bold" value={currentItem?.tanggal || ''} onChange={e => setCurrentItem({...currentItem, tanggal: e.target.value})}/>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase">Nama Toko</label>
              <input required className="w-full p-2.5 bg-slate-50 border rounded-xl mt-1 text-xs font-bold" value={currentItem?.namaToko || ''} onChange={e => setCurrentItem({...currentItem, namaToko: e.target.value})} placeholder="Toko Mitra"/>
            </div>
          </div>
          <div>
            <label className="text-[10px] font-black text-slate-400 uppercase">Area Distribusi</label>
            <select required className="w-full p-2.5 bg-slate-50 border rounded-xl mt-1 text-xs font-bold" value={currentItem?.area || ''} onChange={e => setCurrentItem({...currentItem, area: e.target.value})}>
              {masterArea.map(a => <option key={a.id} value={a.nama}>{a.nama}</option>)}
            </select>
          </div>

          <div className="border-t pt-4 space-y-3">
            <div className="flex justify-between items-center">
              <h4 className="text-xs font-black text-slate-800">Detail Produk Dibeli</h4>
              <button type="button" onClick={addSalesItem} className="text-[10px] font-bold text-blue-600 hover:underline">+ Tambah Item</button>
            </div>
            {currentItem?.items?.map((item, index) => (
              <div key={index} className="grid grid-cols-1 gap-2 bg-slate-50 p-3 rounded-lg border border-slate-200 animate-fadeIn">
                <div className="flex flex-col gap-1.5">
                  <label className="text-[9px] font-bold text-slate-400 uppercase">Pilih Produk</label>
                  <select className="w-full p-2 bg-white border rounded text-[10px] font-bold" value={item.produkId} onChange={e => updateSalesItem(index, 'produkId', e.target.value)}>
                    {masterProduk.map(p => <option key={p.id} value={p.id}>{p.nama}</option>)}
                  </select>
                </div>
                <div className="flex items-center justify-between gap-4 mt-1">
                  <div className="flex items-center gap-2">
                    <span className="text-[9px] font-bold text-slate-400 uppercase">Qty:</span>
                    <input type="number" min="1" className="w-16 p-1 bg-white border rounded text-[10px] font-bold text-center" value={item.qty} onChange={e => updateSalesItem(index, 'qty', e.target.value)}/>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className="text-[10px] font-bold text-emerald-600">{formatCurrency(item.hargaTotal)}</span>
                    {currentItem.items.length > 1 && (
                      <button type="button" onClick={() => removeSalesItem(index)} className="text-red-500 hover:bg-red-50 p-1 rounded-full text-base font-bold">×</button>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>

          <div className="border-t pt-4 flex justify-between font-black text-slate-800 text-sm">
            <span>Grand Total</span>
            <span>{formatCurrency(currentItem?.grandTotal || 0)}</span>
          </div>

          <button type="submit" className="w-full py-3 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 mt-4 shadow-lg shadow-blue-500/10">Simpan Transaksi</button>
        </form>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [isLoading, setIsLoading] = useState(false);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalType, setModalType] = useState(''); 
      const [currentItem, setCurrentItem] = useState(null);
      const [isSidebarOpen, setIsSidebarOpen] = useState(false); 
      
      // Dialog Keamanan & Notifikasi Kustom
      const [deleteConfirm, setDeleteConfirm] = useState({ isOpen: false, id: null, type: '' });
      const [logoutConfirm, setLogoutConfirm] = useState(false);
      const [customNotification, setCustomNotification] = useState({ isOpen: false, title: '', message: '', type: 'info' });

      // --- Sistem State User & Login ---
      const [currentUser, setCurrentUser] = useState(null);
      const [loginUsername, setLoginUsername] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');

      // --- Database States ---
      const [masterProduk, setMasterProduk] = useState([]);
      const [masterArea, setMasterArea] = useState([]);
      const [sales, setSales] = useState([]);
      const [competitors, setCompetitors] = useState([]);
      const [competitorMedia, setCompetitorMedia] = useState([]); 
      const [targetQty, setTargetQty] = useState([]);
      const [targetValue, setTargetValue] = useState([]);
      const [targetEC, setTargetEC] = useState([]); 
      const [targetECBrand, setTargetECBrand] = useState([]); 

      // --- Sesi Hari Berjalan Manual ---
      const [manualCurrentDay, setManualCurrentDay] = useState(4);
      const [manualTotalDays, setManualTotalDays] = useState(31);

      // --- State Range Tanggal Manual untuk Perbandingan Tren ---
      const [dateStartA, setDateStartA] = useState('2026-07-01');
      const [dateEndA, setDateEndA] = useState('2026-07-04');
      const [dateStartB, setDateStartB] = useState('2026-06-01');
      const [dateEndB, setDateEndB] = useState('2026-06-30');

      // --- State Rekomendasi Pintar AI Gemini ---
      const [aiRecommendations, setAiRecommendations] = useState([]);
      const [isAiLoading, setIsAiLoading] = useState(false);

      const getActualEC = () => {
        const uniqueStores = new Set(sales.map(s => s.namaToko));
        return uniqueStores.size;
      };

      const getActualQty = (produkId) => {
        return sales.reduce((total, sale) => {
          const foundItems = sale.items ? sale.items.filter(item => item.produkId === produkId) : [];
          const sumQty = foundItems.reduce((acc, curr) => acc + Number(curr.qty || 0), 0);
          return total + sumQty;
        }, 0);
      };

      const getActualECBrand = (produkId) => {
        const uniqueStores = new Set();
        sales.forEach(sale => {
          const boughtProduct = sale.items ? sale.items.some(item => item.produkId === produkId) : false;
          if (boughtProduct) {
            uniqueStores.add(sale.namaToko);
          }
        });
        return uniqueStores.size;
      };

      const triggerGASUpdate = (sheetName, data) => {
        setIsLoading(true);
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler((response) => {
              setIsLoading(false);
              if (response.success) {
                showNotification("Berhasil", `Data ${sheetName} berhasil disinkronisasi ke Cloud.`, "success");
              } else {
                showNotification("Sinkronisasi Gagal", response.message || "Gagal memperbarui sheet.", "error");
              }
            })
            .withFailureHandler((err) => {
              setIsLoading(false);
              showNotification("Koneksi Error", "Koneksi Google Apps Script terputus: " + err, "error");
            })
            .saveData(sheetName, data);
        } else {
          setIsLoading(false);
          localStorage.setItem(`salespro_local_${sheetName}`, JSON.stringify(data));
          showNotification("Demo Mode", `Data ${sheetName} disimpan secara lokal di browser.`, "success");
        }
      };

      const handleOpenModal = (type, item = null) => {
        setModalType(type);
        if (type === 'addSales') {
          setCurrentItem({
            tanggal: new Date().toISOString().split('T')[0],
            namaToko: '',
            area: masterArea[0]?.nama || '',
            items: [{ produkId: masterProduk[0]?.id || '', qty: 1, hargaTotal: masterProduk[0]?.harga || 0 }],
            grandTotal: masterProduk[0]?.harga || 0
          });
        } else if (type === 'editSales') {
          setCurrentItem({ ...item });
        } else if (type === 'addQty' || type === 'editQty') {
          setCurrentItem(item || { produkId: masterProduk[0]?.id || '', target: 100 });
        } else if (type === 'addValue' || type === 'editValue') {
          setCurrentItem(item || { target: 150000000 });
        } else if (type === 'addEC' || type === 'editEC') {
          setCurrentItem(item || { target: 50 });
        } else if (type === 'addECBrand' || type === 'editECBrand') {
          setCurrentItem(item || { produkId: masterProduk[0]?.id || '', target: 10 });
        } else if (type === 'addComp') {
          setCurrentItem({
            tanggal: new Date().toISOString().split('T')[0],
            namaKompetitor: '',
            area: masterArea[0]?.nama || '',
            produkTerdampakId: masterProduk[0]?.id || '',
            programPromo: ''
          });
        } else if (type === 'addMedia' || type === 'editMedia') {
          setCurrentItem(item || {
            tanggal: new Date().toISOString().split('T')[0],
            namaKompetitor: '',
            area: masterArea[0]?.nama || '',
            produk: '',
            mediaBase64: '',
            catatan: ''
          });
        } else if (type === 'addProduk' || type === 'editProduk') {
          setCurrentItem(item || { nama: '', sku: '', harga: 10000 });
        } else if (type === 'addArea' || type === 'editArea') {
          setCurrentItem(item || { nama: '', kode: '' });
        }
        setIsModalOpen(true);
      };

      const handleTabClick = (tab) => {
        setActiveTab(tab);
        setIsSidebarOpen(false);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('salespro_user');
        setLogoutConfirm(false);
      };

      // --- Fitur Baru: Sebaran Toko Aktif per Wilayah ---
      const areaECMetrics = useMemo(() => {
        const areaMap = {};
        masterArea.forEach(a => {
          areaMap[a.nama] = { storeCount: new Set(), revenue: 0 };
        });
        sales.forEach(s => {
          if (!areaMap[s.area]) {
            areaMap[s.area] = { storeCount: new Set(), revenue: 0 };
          }
          areaMap[s.area].storeCount.add(s.namaToko);
          areaMap[s.area].revenue += s.grandTotal;
        });
        return Object.keys(areaMap).map(key => ({
          area: key,
          storeCount: areaMap[key].storeCount.size,
          revenue: areaMap[key].revenue
        })).sort((a, b) => b.storeCount - a.storeCount);
      }, [sales, masterArea]);

      useEffect(() => {
        const savedUser = localStorage.getItem('salespro_user');
        if (savedUser) {
          try {
            setCurrentUser(JSON.parse(savedUser));
          } catch(e) {
            localStorage.removeItem('salespro_user');
          }
        }

        const cachedAi = localStorage.getItem('salespro_ai_rec');
        if (cachedAi) {
          try {
            setAiRecommendations(JSON.parse(cachedAi));
          } catch(e) {}
        }

        loadDatabase();
      }, []);

      const showNotification = (title, message, type = 'info') => {
        setCustomNotification({ isOpen: true, title, message, type });
      };

      // Membaca data lengkap dari Google Sheets
      const loadDatabase = () => {
        setIsLoading(true);
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler((data) => {
              setMasterProduk(data.MasterProduk || []);
              setMasterArea(data.MasterArea || []);
              setSales(data.Sales || []);
              setCompetitors(data.Competitors || []);
              setCompetitorMedia(data.CompetitorMedia || []); 
              setTargetQty(data.TargetQty || []);
              
              // Parsing target global, hari berjalan, & total hari dari TargetValue
              const tValList = data.TargetValue || [];
              const mainTVal = tValList.find(r => r.id === 'global_val');
              const curDayVal = tValList.find(r => r.id === 'settings_current_day');
              const totalDaysVal = tValList.find(r => r.id === 'settings_total_days');

              setTargetValue(mainTVal ? [mainTVal] : [{ id: 'global_val', target: 150000000 }]);
              setManualCurrentDay(curDayVal ? Number(curDayVal.target) : 4);
              setManualTotalDays(totalDaysVal ? Number(totalDaysVal.target) : 31);

              setTargetEC(data.TargetEC || []);
              setTargetECBrand(data.TargetECBrand || []);
              setIsLoading(false);
            })
            .withFailureHandler((err) => {
              showNotification("Error", "Gagal memuat database: " + err, "error");
              setIsLoading(false);
            })
            .getAllData();
        } else {
          // Fallback lokal (Demo Mode) jika berjalan di luar Apps Script
          setMasterProduk([
            { id: 'p1', nama: 'Kopi Bubuk Premium', sku: 'SKU-KBP-01', harga: 50000 },
            { id: 'p2', nama: 'Kopi Bubuk Arabika', sku: 'SKU-KBA-02', harga: 75000 },
            { id: 'p3', nama: 'Teh Melati Wangi', sku: 'SKU-TMW-03', harga: 25000 }
          ]);
          setMasterArea([
            { id: 'a1', nama: 'Jakarta Selatan', kode: 'JKT-SEL' },
            { id: 'a2', nama: 'Jakarta Barat', kode: 'JKT-BAR' },
            { id: 'a3', nama: 'Bandung', kode: 'BDG-001' }
          ]);
          setSales([
            { 
              id: 's1', tanggal: '2026-06-20', namaToko: 'Toko Sejahtera', area: 'Jakarta Selatan', 
              items: [{ produkId: 'p1', qty: 200, hargaTotal: 10000000 }],
              grandTotal: 10000000
            },
            { 
              id: 's2', tanggal: '2026-06-25', namaToko: 'Toko Makmur', area: 'Jakarta Barat', 
              items: [{ produkId: 'p2', qty: 100, hargaTotal: 7500000 }],
              grandTotal: 7500000
            },
            { 
              id: 's3', tanggal: '2026-06-26', namaToko: 'Toko Maju Jaya', area: 'Jakarta Selatan', 
              items: [{ produkId: 'p1', qty: 150, hargaTotal: 7500000 }],
              grandTotal: 7500000
            },
            { 
              id: 's4', tanggal: '2026-07-02', namaToko: 'Toko Baru Hoki', area: 'Jakarta Selatan', 
              items: [{ produkId: 'p1', qty: 300, hargaTotal: 15000000 }, { produkId: 'p2', qty: 100, hargaTotal: 7500000 }],
              grandTotal: 22500000
            },
            { 
              id: 's5', tanggal: '2026-07-03', namaToko: 'Warung Berkah', area: 'Bandung', 
              items: [{ produkId: 'p3', qty: 200, hargaTotal: 5000000 }],
              grandTotal: 5000000
            }
          ]);
          setCompetitors([
            { id: 'c1', tanggal: '2026-06-22', area: 'Jakarta Selatan', namaKompetitor: 'Brand X', programPromo: 'Beli 2 Gratis 1', produkTerdampakId: 'p1' }
          ]);
          setCompetitorMedia([
            { 
              id: 'cm1', 
              tanggal: '2026-06-24', 
              area: 'Jakarta Selatan', 
              namaKompetitor: 'Brand X', 
              produk: 'Kopi Bubuk Premium', 
              mediaBase64: '', 
              catatan: 'Spanduk promo masif terpasang di depan pasar tradisional.' 
            }
          ]);
          setTargetQty([
            { id: 'tq1', produkId: 'p1', target: 1000 },
            { id: 'tq2', produkId: 'p2', target: 500 }
          ]);
          setTargetValue([
            { id: 'global_val', target: 150000000 }
          ]);
          setTargetEC([
            { id: 'global_ec', target: 50 }
          ]);
          setTargetECBrand([
            { id: 'teb1', produkId: 'p1', target: 20 },
            { id: 'teb2', produkId: 'p2', target: 10 }
          ]);
          setIsLoading(false);
        }
      };

      // Memproses Analisis dengan AI Gemini
      const handleTriggerAiAnalysis = () => {
        if (competitors.length === 0) {
          showNotification("Gagal", "Belum ada laporan aktivitas kompetitor yang masuk untuk dianalisis.", "error");
          return;
        }

        setIsAiLoading(true);
        if (typeof google !== 'undefined') {
          google.script.run
            .withSuccessHandler((aiResultText) => {
              try {
                const parsed = JSON.parse(aiResultText);
                if (parsed && parsed.recommendations) {
                  setAiRecommendations(parsed.recommendations);
                  localStorage.setItem('salespro_ai_rec', JSON.stringify(parsed.recommendations));
                  showNotification("Selesai", "Analisis Taktis Gemini AI sukses diperbarui secara dinamis!", "success");
                }
              } catch (e) {
                showNotification("Error", "Gagal memproses analisis kecerdasan AI.", "error");
              }
              setIsAiLoading(false);
            })
            .withFailureHandler((err) => {
              showNotification("Error AI", err.toString(), "error");
              setIsAiLoading(false);
            })

                          const file = e.target.files[0];
                          if (file) {
                            setIsLoading(true);
                            const reader = new FileReader();
                            reader.readAsDataURL(file);
                            reader.onload = (event) => {
                              const img = new Image();
                              img.src = event.target.result;
                              img.onload = () => {
                                const canvas = document.createElement('canvas');
                                const max_width = 600;
                                const scale = max_width / img.width;
                                if (img.width > max_width) {
                                  canvas.width = max_width;
                                  canvas.height = img.height * scale;
                                } else {
                                  canvas.width = img.width;
                                  canvas.height = img.height;
                                }
                                const ctx = canvas.getContext('2d');
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                                const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                                
                                setCurrentItem({ ...currentItem, mediaBase64: compressedBase64 });
                                setIsLoading(false);
                                showNotification("Selesai", "Foto berhasil dikompresi & dimuat.", "success");

                            };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
